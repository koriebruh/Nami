[package]
name = "nami-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6.0", features = ["rand_core"] }
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
hex = "0.4.3"
hickory-resolver = "0.26.3"
hkdf = "0.13.0"
http-body-util = "0.1.5"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
oauth2 = "5.0.0"
password-hash = { version = "0.6.1", features = ["rand_core"] }
rand = { version = "0.8", features = ["std_rng", "std"] }
rand_core = "0.10.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rustls = "0.23.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", features = ["zeroize"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
sqlx-session = { package = "sqlx", version = "0.8", features = ["runtime-tokio", "postgres"] }
surge-ping = "0.9.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-stream = "0.1.19"
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4", "serde", "v7"] }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
zeroize = "1.9.1"

[dev-dependencies]
rcgen = "0.14.10"
reqwest = { version = "0.13.5", features = ["json"] }
rmp-serde = "1.3.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
tower = "0.5.3"
tower-sessions = { version = "0.14.0", features = ["memory-store"] }
url = "2.5.8"
wiremock = "0.6.5"
